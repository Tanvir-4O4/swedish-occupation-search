<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Swedish Occupation</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            position: relative;
        }

        .main-container {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 360px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), 
                        inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            box-sizing: border-box;
        }

        .title-wrapper {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            gap: 6px;
        }

        .find-text {
            color: #ff3b30;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .france-text {
            color: #007aff;
            font-weight: 500;
            font-size: 13px;
            opacity: 0.9;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px;
            font-size: 14px;
            font-family: inherit;
            color: #333;
            background-color: #fff;
            border: 2px solid transparent;
            border-radius: 20px;
            outline: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
        }

        .search-input::placeholder {
            color: #a0aabf;
            font-weight: 400;
        }

        .search-input:focus {
            border-color: #007aff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.15);
        }

        .suggestions-box {
            position: absolute;
            top: 48px;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            max-height: 80vh; 
            overflow-y: auto;
            display: none;
            z-index: 10;
            padding: 4px 0;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .suggestions-box::-webkit-scrollbar {
            width: 4px;
        }
        
        .suggestions-box::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }

        .suggestion-item {
            padding: 6px 14px; 
            cursor: pointer;
            font-size: 12px; 
            color: #475569;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .suggestion-item.active {
            background-color: #f0f7ff;
            color: #007aff;
            border-left: 3px solid #007aff;
            padding-left: 11px;
        }

        .suggestion-item:hover {
            background-color: #f8fafc;
        }

        .highlight {
            color: #007aff;
            font-weight: 600;
        }
    

/* Swedish occupation information panel */
.info-box{position:fixed;top:16px;left:395px;width:310px;min-height:150px;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);border:1px solid rgba(0,0,0,.05);padding:16px;display:none;z-index:20;box-sizing:border-box}
.info-box.show{display:block}
.info-title{color:#007aff;font-size:18px;font-weight:600;margin-bottom:12px;word-break:break-word}
.info-label{color:#94a3b8;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-top:9px;margin-bottom:3px}
.info-value{color:#475569;font-size:13px;line-height:1.5;word-break:break-word}
@media(max-width:760px){.info-box{position:absolute;top:170px;left:16px;width:360px;max-width:calc(100vw - 32px)}}
</style>
</head>

":"överkonstapel","meaning":"সামরিক কর্পোরাল","full":""},{"name":"överståthållare","meaning":"গভর্নর","full":""},{"name":"ölbryggare","meaning":"বিয়ার প্রস্তুতকারী","full":""}];

        const searchInput = document.getElementById('search-input');
        const suggestionsBox = document.getElementById('suggestions-box');
        const infoBox = document.getElementById('info-box');
        const infoTitle = document.getElementById('info-title');
        const infoMeaning = document.getElementById('info-meaning');
        const infoFull = document.getElementById('info-full');
        let currentFocus = -1;
        let filteredOccupations = [];

        function normalizeText(value) {
            return String(value ?? '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '');
        }

        function showInfo(item) {
            if (!item) {
                infoBox.classList.remove('show');
                return;
            }
            infoTitle.textContent = item.name;
            infoMeaning.textContent = item.meaning || 'তথ্য নেই';
            infoFull.textContent = item.full || 'Full form নেই';
            infoBox.classList.add('show');
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g,'&amp;').replace(/</g,'&lt;')
                .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
                .replace(/'/g,'&#039;');
        }

        function renderSuggestions(query) {
            suggestionsBox.innerHTML = '';
            if (!filteredOccupations.length) {
                suggestionsBox.style.display = 'none';
                return;
            }

            const visible = filteredOccupations.slice(0, 50);
            visible.forEach((item, index) => {
                const div = document.createElement('div');
                div.classList.add('suggestion-item');
                if (index === currentFocus) div.classList.add('active');

                // Keep original occupation spelling visible while highlighting a matched portion.
                const name = item.name;
                const nq = normalizeText(query);
                let matched = false;
                for (let i = 0; i < name.length; i++) {
                    const part = normalizeText(name.slice(i, i + Math.max(1, query.length)));
                    if (part === nq) {
                        const before = escapeHtml(name.slice(0,i));
                        const match = escapeHtml(name.slice(i,i + Math.max(1, query.length)));
                        const after = escapeHtml(name.slice(i + Math.max(1, query.length)));
                        div.innerHTML = before + '<span class="highlight">' + match + '</span>' + after;
                        matched = true;
                        break;
                    }
                }
                if (!matched) div.textContent = name;

                div.addEventListener('mouseenter', function() {
                    currentFocus = index;
                    renderSuggestions(query);
                    showInfo(item);
                });

                div.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    searchInput.value = item.name;
                    currentFocus = index;
                    showInfo(item);
                    suggestionsBox.style.display = 'none';
                    searchInput.focus();
                });

                suggestionsBox.appendChild(div);
            });
            suggestionsBox.style.display = 'block';
        }

        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            currentFocus = -1;

            if (query === '') {
                filteredOccupations = [];
                suggestionsBox.style.display = 'none';
                infoBox.classList.remove('show');
                return;
            }

            const normalizedQuery = normalizeText(query);
            filteredOccupations = occupations.filter(item =>
                normalizeText(item.name).includes(normalizedQuery)
            );

            renderSuggestions(query);
            if (filteredOccupations.length) showInfo(filteredOccupations[0]);
            else infoBox.classList.remove('show');
        });

        searchInput.addEventListener('keydown', function(e) {
            const items = suggestionsBox.getElementsByClassName('suggestion-item');
            if (items.length === 0) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                currentFocus++;
                if (currentFocus >= items.length) currentFocus = 0;
                updateActive();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                currentFocus--;
                if (currentFocus < 0) currentFocus = items.length - 1;
                updateActive();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (currentFocus > -1 && filteredOccupations[currentFocus]) {
                    const item = filteredOccupations[currentFocus];
                    searchInput.value = item.name;
                    showInfo(item);
                    suggestionsBox.style.display = 'none';
                }
            } else if (e.key === 'Escape') {
                suggestionsBox.style.display = 'none';
                infoBox.classList.remove('show');
            }
        });

        function updateActive() {
            const items = suggestionsBox.getElementsByClassName('suggestion-item');
            for (let i=0; i<items.length; i++) items[i].classList.remove('active');
            if (currentFocus < 0 || !filteredOccupations[currentFocus]) return;
            items[currentFocus].classList.add('active');

            // Original map-style behavior: ArrowUp/ArrowDown puts the selected name in the search box.
            searchInput.value = filteredOccupations[currentFocus].name;
            showInfo(filteredOccupations[currentFocus]);
            items[currentFocus].scrollIntoView({block:'nearest'});
        }

        document.addEventListener('click', function(e) {
            if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                suggestionsBox.style.display = 'none';
            }
        });
    </script>
</body>
</html>
